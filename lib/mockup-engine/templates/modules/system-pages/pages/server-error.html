<!doctype html>
<html lang="en">
<head>
  <title>Something went wrong</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/mk.js"></script>
  <script src="../strings/en-GB.js"></script>
  <script src="../data/fixtures.js"></script>
  <script src="../components/AppLayout.js"></script>
  <script src="../components/AuthLayout.js"></script>
  <script src="../components/Badge.js"></script>
  <script src="../components/DataTable.js"></script>
  <script src="../components/EmptyState.js"></script>
  <script src="../components/ErrorPage.js"></script>
  <script src="../components/ErrorState.js"></script>
  <script src="../components/InvoiceStatusBadge.js"></script>
  <script src="../components/MoneyField.js"></script>
  <script src="../components/Notice.js"></script>
  <script src="../components/Pagination.js"></script>
  <script src="../components/PermissionGrid.js"></script>
  <script src="../components/SelectField.js"></script>
  <script src="../components/SkeletonBox.js"></script>
  <script src="../components/TableSkeleton.js"></script>
  <script src="../components/TextField.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const { components: C } = MK;

    // What any page shows, inside the layout, when it fails to render. The reference is the id
    // the error was reported under, so support can find it.
    MK.page({
      id: 'server-error',
      route: '*:render-error',
      title: 'Something went wrong',
      needs: { permission: 'public', notes: ['Shown by the error boundary on any route; previewed in the app with ?system=crash'] },
      render: () => C.ErrorPage({
        code: 'Error',
        title: 'Something went wrong',
        body: 'This page could not be shown. Reloading usually fixes it. If it does not, give support the reference below.',
        reference: 'err_3f9a1c2b',
        reloadAction: 'reloadPage',
        link: { label: 'Go to the start page', href: MK.href('./dashboard.html') }, // the app's / sends each role to its first page
      }),
    });
  </script>
</body>
</html>
