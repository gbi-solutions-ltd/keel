<!doctype html>
<html lang="en">
<head>
  <title>Reset your password</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/mk.js"></script>
  <script src="../strings/en-GB.js"></script>
  <script src="../data/fixtures.js"></script>
  <script src="../components/AppLayout.js"></script>
  <script src="../components/AuthLayout.js"></script>
  <script src="../components/Badge.js"></script>
  <script src="../components/DataTable.js"></script>
  <script src="../components/Dialog.js"></script>
  <script src="../components/EmptyState.js"></script>
  <script src="../components/ErrorPage.js"></script>
  <script src="../components/ErrorState.js"></script>
  <script src="../components/InvoiceStatusBadge.js"></script>
  <script src="../components/MoneyField.js"></script>
  <script src="../components/Notice.js"></script>
  <script src="../components/Pagination.js"></script>
  <script src="../components/PermissionGrid.js"></script>
  <script src="../components/SelectField.js"></script>
  <script src="../components/SessionTimeoutDialog.js"></script>
  <script src="../components/SkeletonBox.js"></script>
  <script src="../components/TableSkeleton.js"></script>
  <script src="../components/TextField.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const { html, components: C } = MK;
    const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    MK.page({
      id: 'forgot-password',
      route: '/forgot-password',
      title: 'Reset your password',
      layout: 'AuthLayout',
      needs: {
        api: ['POST /v1/auth/password-reset { email } -> 202 always, whether or not the account exists'],
        permission: 'public',
      },
      state: { email: '', error: null, sent: null, failed: false },
      actions: {
        setEmail(state, _e, el) { state.email = el.value; return false; },
        send(state, _e, _el, ctx) {
          if (!EMAIL.test(state.email.trim())) { state.error = 'Enter an email address, like name@example.com.'; ctx.focus('reset-email'); return; }
          state.error = null;
          // ?state=error: the request fails on our side; that says nothing about the account.
          if (ctx.params.state === 'error') { state.failed = true; return; }
          state.sent = state.email.trim();
          ctx.focus('sent-heading');
        },
      },
      // The answer is the same for any address, so it never tells anyone who has an account.
      render: ({ state }) => (state.sent ? html`
        <div class="form">
          <h1 id="sent-heading" tabindex="-1">Check your email</h1>
          <p>If there is an account for ${state.sent}, we have sent it a link to reset the password. The link works for 30 minutes.</p>
          <p class="muted">Nothing after a few minutes? Check spam, or try again.</p>
          <a href="${MK.href('./sign-in.html')}">Back to sign in</a>
        </div>` : html`
        <div class="form">
          <h1>Reset your password</h1>
          <p>Enter the email you sign in with, and we will send you a link.</p>
          ${state.failed ? C.Notice({ tone: 'danger', text: 'We could not send the link just now. Please try again in a moment.' }) : ''}
          <form class="form" data-action="send" novalidate>
            ${C.TextField({ id: 'reset-email', label: 'Email', type: 'email', autocomplete: 'username', value: state.email, error: state.error, action: 'setEmail' })}
            <button type="submit" class="button button--primary">Send link</button>
          </form>
          <a href="${MK.href('./sign-in.html')}">Back to sign in</a>
        </div>`),
    });
  </script>
</body>
</html>
