<!doctype html>
<html lang="en">
<head>
  <title>Choose a new password</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/mk.js"></script>
  <script src="../strings/en-GB.js"></script>
  <script src="../data/fixtures.js"></script>
  <script src="../components/AppLayout.js"></script>
  <script src="../components/AuthLayout.js"></script>
  <script src="../components/Badge.js"></script>
  <script src="../components/DataTable.js"></script>
  <script src="../components/Dialog.js"></script>
  <script src="../components/EmptyState.js"></script>
  <script src="../components/ErrorPage.js"></script>
  <script src="../components/ErrorState.js"></script>
  <script src="../components/InvoiceStatusBadge.js"></script>
  <script src="../components/MoneyField.js"></script>
  <script src="../components/Notice.js"></script>
  <script src="../components/Pagination.js"></script>
  <script src="../components/PermissionGrid.js"></script>
  <script src="../components/SelectField.js"></script>
  <script src="../components/SessionTimeoutDialog.js"></script>
  <script src="../components/SkeletonBox.js"></script>
  <script src="../components/TableSkeleton.js"></script>
  <script src="../components/TextField.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const { html, components: C } = MK;
    const COMMON = ['password12345', 'service12345', '123456789012'];

    MK.page({
      id: 'reset-password',
      route: '/reset-password', // the link carries ?token=
      title: 'Choose a new password',
      layout: 'AuthLayout',
      needs: {
        api: [
          'GET /v1/auth/password-reset/{token} -> { email_hint, min_length }; 410 link_expired',
          'POST /v1/auth/password-reset/{token} { password } -> 204; 400 weak_password { reason }; 410 link_expired',
        ],
        permission: 'public',
        notes: ['Strength rules beyond length and a common-password list are the server\'s'],
      },
      state: { password: '', confirm: '', errors: {}, done: false },
      load: (fx, { params }) => (params.token === 'rst_expired' ? { expired: true } : { expired: false, email_hint: fx.auth.challenge.email_destination, min_length: fx.auth.password_policy.min_length }),
      actions: {
        setPassword(state, _e, el) { state.password = el.value; return false; },
        setConfirm(state, _e, el) { state.confirm = el.value; return false; },
        save(state, _e, _el, ctx) {
          const min = ctx.fixtures.auth.password_policy.min_length;
          // The browser checks only that the two match; length and strength are the server's answer.
          const errors = {};
          if (state.password && state.confirm !== state.password) errors.confirm = 'The passwords do not match.';
          else if (state.password.length < min) errors.password = `Use at least ${min} characters.`;
          else if (COMMON.includes(state.password.toLowerCase())) errors.password = 'That password is too common. Choose another.';
          state.errors = errors;
          if (errors.password) { ctx.focus('new-password'); return; }
          if (errors.confirm) { ctx.focus('confirm-password'); return; }
          state.done = true;
          ctx.focus('done-heading');
        },
      },
      render: ({ state, data, status }) => {
        const signIn = html`<a href="${MK.href('./sign-in.html')}">Back to sign in</a>`;
        if (status === 'loading') return html`<div class="form" role="status"><span class="visually-hidden">Loading</span>${C.SkeletonBox({ shape: 'title' })}${C.SkeletonBox({ shape: 'text' })}${C.SkeletonBox({ shape: 'text' })}</div>`;
        if (status === 'error') return html`<div class="form">${C.ErrorState({ body: 'We could not check this link. Please try again.' })}${signIn}</div>`;
        if (data.expired) return html`
          <div class="form">
            <h1>This link has expired</h1>
            <p>Reset links work once, for 30 minutes. Ask for a new one.</p>
            <a class="button button--primary" href="${MK.href('./forgot-password.html')}">Get a new link</a>
            ${signIn}
          </div>`;
        if (state.done) return html`
          <div class="form">
            <h1 id="done-heading" tabindex="-1">Your password is changed</h1>
            <p>Sign in with your new password. You are signed out on your other devices.</p>
            <a class="button button--primary" href="${MK.href('./sign-in.html')}">Sign in</a>
          </div>`;
        return html`
          <div class="form">
            <h1>Choose a new password</h1>
            <p class="muted">For ${data.email_hint}</p>
            <form class="form" data-action="save" novalidate>
              ${C.TextField({ id: 'new-password', label: 'New password', type: 'password', autocomplete: 'new-password', value: state.password, hint: `At least ${data.min_length} characters. A few unrelated words make a strong one.`, error: state.errors.password, action: 'setPassword' })}
              ${C.TextField({ id: 'confirm-password', label: 'Confirm new password', type: 'password', autocomplete: 'new-password', value: state.confirm, error: state.errors.confirm, action: 'setConfirm' })}
              <button type="submit" class="button button--primary">Change password</button>
            </form>
            ${signIn}
          </div>`;
      },
    });
  </script>
</body>
</html>
