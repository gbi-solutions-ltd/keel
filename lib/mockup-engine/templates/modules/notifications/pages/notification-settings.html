<!doctype html>
<html lang="en">
<head>
  <title>Notification settings</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/mk.js"></script>
  <script src="../strings/en-GB.js"></script>
  <script src="../data/fixtures.js"></script>
  <script src="../components/AppLayout.js"></script>
  <script src="../components/AccountMenu.js"></script>
  <script src="../components/Badge.js"></script>
  <script src="../components/DataTable.js"></script>
  <script src="../components/EmptyState.js"></script>
  <script src="../components/ErrorPage.js"></script>
  <script src="../components/ErrorState.js"></script>
  <script src="../components/FilterTabs.js"></script>
  <script src="../components/InvoiceStatusBadge.js"></script>
  <script src="../components/MoneyField.js"></script>
  <script src="../components/NotificationList.js"></script>
  <script src="../components/NotificationMenu.js"></script>
  <script src="../components/Pagination.js"></script>
  <script src="../components/PermissionGrid.js"></script>
  <script src="../components/SelectField.js"></script>
  <script src="../components/SkeletonBox.js"></script>
  <script src="../components/TableSkeleton.js"></script>
  <script src="../components/TextField.js"></script>
  <script src="../components/ToggleList.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const { html, components: C } = MK;

    MK.page({
      id: 'notification-settings',
      route: '/account/notifications',
      title: 'Notification settings',
      needs: {
        api: ['GET /v1/me/notification-preferences and PUT -> NotificationPreferences; a locked one cannot be turned off'],
        permission: 'authenticated',
      },
      state: { changed: {}, saved: false },
      load: (fx, { state }) => ({ items: fx.notification_preferences.map((p) => ({ ...p, email: p.event in state.changed ? state.changed[p.event] : p.email })) }),
      actions: {
        // Each change saves at once (PUT), and says so.
        toggle(state, _e, el) { state.changed[el.dataset.value] = el.checked; state.saved = true; },
      },
      render: ({ state, data, status }) => {
        const header = html`
          <h1>Notification settings</h1>
          <p class="muted">You always see notifications in the app. Choose which also come to you by email.</p>`;
        if (status === 'loading') return html`<div class="stack">${header}<div class="card" role="status"><span class="visually-hidden">Loading</span>${Array.from({ length: 5 }, () => C.SkeletonBox({ shape: 'text' }))}</div></div>`;
        if (status === 'error') return html`<div class="stack">${header}<div class="card">${C.ErrorState({ body: 'We could not load your settings. Please refresh.' })}</div></div>`;
        return html`
          <div class="stack">
            ${header}
            <div class="card stack">
              ${C.ToggleList({
                legend: 'Email me when',
                action: 'toggle',
                items: data.items.map((p) => ({ id: p.event, label: p.label, checked: p.email, locked: p.locked, lockedReason: 'Always on, so you hear about sign-ins you did not make.' })),
              })}
              <p class="muted">${state.saved ? 'Saved.' : ''}</p>
            </div>
          </div>`;
      },
    });
  </script>
</body>
</html>
