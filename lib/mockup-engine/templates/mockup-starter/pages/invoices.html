<!doctype html>
<html lang="en">
<head>
  <title>Invoices</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/mk.js"></script>
  <script src="../strings/en-GB.js"></script>
  <script src="../data/fixtures.js"></script>
  <script src="../data/list-query.js"></script>
  <script src="../data/money.js"></script>
  <script src="../components/AppLayout.js"></script>
  <script src="../components/Badge.js"></script>
  <script src="../components/DataTable.js"></script>
  <script src="../components/EmptyState.js"></script>
  <script src="../components/ErrorPage.js"></script>
  <script src="../components/ErrorState.js"></script>
  <script src="../components/InvoiceStatusBadge.js"></script>
  <script src="../components/MoneyField.js"></script>
  <script src="../components/Pagination.js"></script>
  <script src="../components/SelectField.js"></script>
  <script src="../components/SkeletonBox.js"></script>
  <script src="../components/TableSkeleton.js"></script>
  <script src="../components/TextField.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const { html, components: C } = MK;
    const PAGE_SIZE = 8;
    // The organisation's currency: the app has it from the session before any page loads.
    const CURRENCY = window.FIXTURES.organisation.currency;
    const COLUMNS = [
      { key: 'number', label: MK.t('invoices.column.number'), cell: (r) => r.number },
      { key: 'customer_name', label: MK.t('invoices.column.customer'), sortable: true, cell: (r) => r.customer_name },
      { key: 'issued_on', label: MK.t('invoices.column.issued'), sortable: true, cell: (r) => MK.format.date(r.issued_on) },
      { key: 'status', label: MK.t('invoices.column.status'), cell: (r) => C.InvoiceStatusBadge({ status: r.status }) },
      { key: 'amount', label: MK.t('invoices.column.amount'), sortable: true, numeric: true, cell: (r) => MK.format.money(r.amount, r.currency) },
    ];

    MK.page({
      id: 'invoices',
      route: '/invoices',
      title: MK.t('invoices.title'),
      needs: {
        api: ['GET /v1/invoices?q=&status=&min_amount=&sort=&cursor=&limit= -> InvoicePage { items, next_cursor }'],
        permission: 'invoice:read',
        notes: [
          'min_amount is integer minor units, as the form submits it',
          'cursor paged: limit is 8 here (the API caps it at 100), next_cursor is null on the last page, and there is no total; "Page N" counts the cursors followed',
        ],
      },
      // State may be a function of the URL's params: ?q= opens the list already searched.
      // cursors: the next_cursor of each page followed, so Previous can go back; the page shown is
      // the one the last cursor opens (none: the first), and its number is cursors.length + 1.
      state: ({ params }) => ({
        values: { q: params.q || '', min_amount: '' },
        search: params.q || '', status: '', min: 0, sort: '-issued_on', cursors: [],
      }),
      // Stands in for the API: search, filter, sort and page (by cursor) with the shared data
      // helper, exactly where the server will do them.
      load: (fx, { scenario, state }) => window.listQuery(scenario === 'empty' ? [] : fx.invoices, {
        search: state.search,
        searchKeys: ['number', 'customer_name'],
        filters: [
          { key: 'status', value: state.status },
          { key: 'amount', value: state.min || '', fn: (r, min) => r.amount >= min },
        ],
        sort: state.sort,
        cursor: state.cursors[state.cursors.length - 1],
        limit: PAGE_SIZE,
      }),
      actions: {
        // The form submits what the API takes: q as typed, status as chosen ('' is all), min_amount as integer minor units from
        // the MoneyField's hidden input.
        applyFilters(state, _e, el) {
          const form = new FormData(el);
          state.search = String(form.get('q') || '');
          state.status = String(form.get('status') || '');
          state.min = Number(form.get('min_amount') || 0);
          state.cursors = []; // a cursor is good only for the query that made it
        },
        sortBy(state, _e, el) {
          const k = el.dataset.value;
          state.sort = state.sort === `-${k}` ? k : `-${k}`;
          state.cursors = [];
        },
        // The next button carries the list's next_cursor (Pagination's nextCursor).
        nextPage(state, _e, el) { state.cursors = [...state.cursors, el.dataset.cursor]; },
        prevPage(state) { state.cursors = state.cursors.slice(0, -1); },
      },
      render: ({ state, data, status }) => {
        const filtered = Boolean(state.search || state.status || state.min);
        const filters = html`
          <form class="stack" data-action="applyFilters" role="search" aria-label="${MK.t('invoices.filters.label')}">
            <div class="toolbar">
              ${C.TextField({ id: 'invoice-search', name: 'q', label: MK.t('invoices.search.label'), type: 'search', value: state.values.q, hint: MK.t('invoices.search.hint'), action: 'setValue' })}
              ${C.SelectField({ id: 'invoice-status', name: 'status', label: MK.t('invoices.status.label'), hint: MK.t('invoices.status.hint'), value: state.status, options: [
                { value: '', label: MK.t('invoices.status.all') },
                ...['open', 'overdue', 'paid'].map((s) => ({ value: s, label: MK.t(`InvoiceStatusBadge.${s}`) })),
              ] })}
              ${C.MoneyField({ id: 'invoice-min', name: 'min_amount', label: MK.t('invoices.minimum.label'), currency: CURRENCY, value: state.values.min_amount, hint: MK.t('invoices.minimum.hint') })}
            </div>
            <div class="row"><button type="submit" class="button button--primary">${MK.t('invoices.apply')}</button></div>
          </form>`;
        let content;
        if (status === 'loading') content = C.TableSkeleton({ columns: COLUMNS.map((c) => c.label), rows: PAGE_SIZE });
        else if (status === 'error') content = C.ErrorState({ body: MK.t('invoices.error') });
        else if (!data.rows.length) content = filtered
          ? C.EmptyState({ title: MK.t('invoices.noMatch.title'), body: MK.t('invoices.noMatch.body') })
          : C.EmptyState({ title: MK.t('invoices.empty.title'), body: MK.t('invoices.empty.body') });
        else content = html`
          ${C.DataTable({ caption: MK.t('invoices.table.caption'), columns: COLUMNS, rows: data.rows, sort: state.sort, sortAction: 'sortBy' })}
          ${C.Pagination({ page: state.cursors.length + 1, hasPrev: state.cursors.length > 0, nextCursor: data.next_cursor, prevAction: 'prevPage', nextAction: 'nextPage' })}`;
        return html`<div class="stack"><h1>${MK.t('invoices.title')}</h1>${filters}<div class="card">${content}</div></div>`;
      },
    });
  </script>
</body>
</html>
