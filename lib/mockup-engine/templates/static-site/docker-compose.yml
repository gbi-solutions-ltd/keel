# The app's build on its own origin (skills/convert-mockup/references/api-integration.md, "Another origin"). Every port
# is published on 127.0.0.1 only. Set APP_DIST (the build) and HEADERS_CONF (headers.mjs --emit
# nginx, with the API's origin filled into connect-src).
services:
  web:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    # Unprivileged: nginx's own user (101), every capability dropped and none added back (it
    # listens on 8080 and never switches user), no new privileges, a read-only root with its
    # writable paths in memory, owned by that user.
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=0700
    ports: ["127.0.0.1:${APP_PORT:-4180}:8080"]
    volumes:
      - ${APP_DIST:?set it to the production build}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HEADERS_CONF:?set it to headers.mjs --emit nginx output}:/etc/nginx/headers.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]  # supply-chain-scan: allow the container's own health check, against its loopback port
      interval: 5s
      retries: 10
