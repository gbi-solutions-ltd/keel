# The app's production build as a static site: its security headers on every answer (headers.conf,
# from the engine's headers.mjs --emit nginx), index.html for any path that is not a file (the
# router's), hashed assets cached for a year, index.html never.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location /assets/ {
    include /etc/nginx/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
