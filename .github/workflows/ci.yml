name: CI

on:
  push:
    # sandbox is built as well as main, because on 2026-10-17 the release commit 5f09164 reached
    # sandbox and was first built on macOS only once a pull request existed, where
    # `keel plan batches` failed (5b50a83). A build on the push finds that before the release.
    branches: [main, sandbox]
  pull_request:

# Stated here because otherwise the token's scope is a repository setting nobody can see from this
# file, and no job below writes to the repository.
permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and templates
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than a tag, because a tag can be moved and a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every rule in the validator exists because it was violated during development.
      - name: Run tests
        run: tests/run-tests.sh

      # The command comes from .keel/profile.json rather than being restated here. Restating it is
      # how the pipeline came to run a stricter check than anyone ran locally.
      # shellcheck and jq are preinstalled on ubuntu-latest; the apt install this step used to run
      # added nothing and once hung the job for 23 minutes on `apt-get update`.
      - name: Shellcheck
        run: |
          shellcheck --version | head -2
          LINT=$(jq -r '.verify.lint' .keel/profile.json)
          echo "running: $LINT"
          eval "$LINT"

  # A separate job rather than a matrix on `validate`, so that job's required-check name does not
  # change. Advisory until it has a week of green runs, by decision on 2026-09-25: branch
  # protection does not list it yet. macOS is the maintainer's platform and had never run in CI.
  # Stock macOS ships neither `timeout` nor `gtimeout`, so doctor runs verify commands unbounded
  # there; the first step records which one this runner has, because a runner image with coreutils
  # would not take that path. Tests only: shellcheck is not preinstalled on macOS runners, so the
  # lint step in run-tests.sh reports SKIP here, and lint results do not depend on the platform.
  test-macos:
    name: Tests on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Record which timeout binary exists
        run: command -v timeout gtimeout || echo "neither timeout nor gtimeout"

      # The plan tests' dash cases need a UTF-8 locale that exists on the runner: macOS awk splits a
      # multibyte dash under UTF-8 and a C locale hides that. Whether C.UTF-8 exists on macOS was
      # not known when this step was added (2026-10-17), so the run records the locales the runner
      # has rather than assuming one. It only records, so it must not fail the job, even if this
      # step is ever run with pipefail (`shell: bash`): `|| true` covers no match, and sed reads
      # all its input where head would hand grep a SIGPIPE.
      - name: Record the runner's locales
        run: |
          locale || true
          locale -a | grep -i -E 'utf-?8' | sed -n 1,20p || true

      - name: Run tests
        run: tests/run-tests.sh

      # The same suite again under the bash macOS ships, 3.2, which is what a user's Mac runs.
      # tests/run-tests.sh starts with `#!/usr/bin/env bash`, and on this runner that may resolve to
      # a newer bash than /bin/bash, so the step puts a symlink to /bin/bash first on PATH and runs
      # the suite with /bin/bash itself. It prints the version it runs under, so a log shows whether
      # the step covered 3.2 or only another bash.
      - name: Run tests under the bash macOS ships (3.2)
        run: |
          mkdir -p "$RUNNER_TEMP/bash32" && ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          PATH="$RUNNER_TEMP/bash32:$PATH" bash --version | sed -n 1p
          PATH="$RUNNER_TEMP/bash32:$PATH" /bin/bash tests/run-tests.sh

  # ruff over the Python in lib/, in CI only, by decision on 2026-09-25: the local lint string stays
  # shellcheck, so a contributor needs nothing new. Installed by hash from ruff-requirements.txt, so
  # a ruff release cannot turn CI red on its own and a replaced file on PyPI cannot run here, and
  # the rule set named, because ruff's defaults add a style rule with 110 findings here. --isolated
  # keeps any ruff configuration outside the repository out of the result. It installs into a venv
  # because the runner's system Python refuses pip installs (PEP 668).
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install --require-hashes --no-deps -r .github/ruff-requirements.txt
          "$RUNNER_TEMP/ruff/bin/ruff" check --isolated --no-cache --select E4,E7,E9,F lib/

  # A separate job, deliberately, rather than one more line inside `validate`. This is the check that
  # decides whether code reaching other people's machines is safe, so it must be selectable as a
  # required status check on its own and must not be able to pass because an unrelated step was
  # skipped. It runs on a full checkout because the scan reads the whole tracked tree.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan for anything that would run on an installing machine
        run: tests/supply-chain-scan.sh

      # The scan is a denylist, so a rule that quietly stops matching is the failure that matters.
      # These tests prove every rule still fires, and they are the reason the scan above is worth
      # gating on.
      - name: Prove the scan still catches what it claims
        run: tests/test-supply-chain.sh
