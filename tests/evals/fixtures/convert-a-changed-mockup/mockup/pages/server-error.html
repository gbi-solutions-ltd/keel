<!doctype html>
<html lang="en-GB">
<head>
  <title>Something went wrong</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/mk.js"></script>
  <script src="../strings/en-GB.js"></script>
  <script src="../data/fixtures.js"></script>
  <script src="../components/AppLayout.js"></script>
  <script src="../components/ErrorPage.js"></script>
  <script src="../components/Notice.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    // system-pages module: what any page shows, inside the layout, when it fails to render. The
    // reference is the id the error was reported under, so support can find it.
    MK.page({
      id: 'server-error',
      route: '*:render-error',
      title: MK.t('server-error.title'),
      needs: { permission: 'public', notes: ['Shown by the error boundary on any route; previewed in the app with ?system=crash'] },
      render: () => MK.components.ErrorPage({
        code: MK.t('server-error.code'),
        title: MK.t('server-error.title'),
        body: MK.t('server-error.body'),
        reference: 'err_7c41d09e',
        reloadAction: 'reloadPage',
        // the app's / sends each role to its first page; both roles start at the catalogue
        link: { label: MK.t('server-error.link'), href: MK.href('./equipment.html') },
      }),
    });
  </script>
</body>
</html>
