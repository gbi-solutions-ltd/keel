<!doctype html>
<html lang="en-GB">
<head>
  <title>Equipment</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/mk.js"></script>
  <script src="../strings/en-GB.js"></script>
  <script src="../data/fixtures.js"></script>
  <script src="../data/list-query.js"></script>
  <script src="../components/AppLayout.js"></script>
  <script src="../components/Badge.js"></script>
  <script src="../components/CardListSkeleton.js"></script>
  <script src="../components/EmptyState.js"></script>
  <script src="../components/ErrorPage.js"></script>
  <script src="../components/ErrorState.js"></script>
  <script src="../components/FilterTabs.js"></script>
  <script src="../components/ItemAvailabilityBadge.js"></script>
  <script src="../components/ItemCard.js"></script>
  <script src="../components/ItemCardList.js"></script>
  <script src="../components/Notice.js"></script>
  <script src="../components/Pagination.js"></script>
  <script src="../components/SkeletonBox.js"></script>
  <script src="../components/TextField.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const { html, components: C } = MK;
    const PAGE_SIZE = 12;
    const CATEGORIES = ['', 'laptop', 'camera', 'projector', 'audio'];

    MK.page({
      id: 'equipment',
      route: '/equipment',
      title: MK.t('equipment.title'),
      needs: {
        api: ['GET /v1/items?q=&category=&cursor=&limit= -> ItemPage { items, next_cursor }'],
        permission: 'equipment:read',
        uses: ['loan:request'],
        notes: [
          'availability is computed by the server for today in the organisation zone (Europe/Dublin): free, or on loan with the last day of the loan',
          'ordered by name; cursor paged with limit 12 here (the API caps it at 100); no total',
          'q matches the name, the asset tag and the description',
        ],
      },
      state: ({ params }) => ({ values: { q: params.q || '' }, search: params.q || '', category: '', cursors: [] }),
      // Stands in for the API: search, the category filter, the order and the cursor paging.
      load: (fx, { scenario, state }) => window.listQuery(scenario === 'empty' ? [] : fx.items, {
        search: state.search,
        searchKeys: ['name', 'asset_tag', 'description'],
        filters: { category: state.category },
        sort: 'name',
        cursor: state.cursors[state.cursors.length - 1],
        limit: PAGE_SIZE,
      }),
      actions: {
        applySearch(state, _e, el) {
          state.search = String(new FormData(el).get('q') || '');
          state.cursors = []; // a cursor is good only for the query that made it
        },
        setCategory(state, _e, el) {
          state.category = el.dataset.value;
          state.cursors = [];
        },
        nextPage(state, _e, el) { state.cursors = [...state.cursors, el.dataset.cursor]; },
        prevPage(state) { state.cursors = state.cursors.slice(0, -1); },
      },
      render: ({ state, data, status }) => {
        const filtered = Boolean(state.search || state.category);
        const requestHref = MK.can('loan:request') ? (item) => MK.href(`./request-new.html?item=${item.id}`) : null;
        const toolbar = html`
          <form class="toolbar" data-action="applySearch" role="search" aria-label="${MK.t('equipment.search.form')}">
            ${C.TextField({ id: 'equipment-search', name: 'q', label: MK.t('equipment.search.label'), type: 'search', value: state.values.q, hint: MK.t('equipment.search.hint'), action: 'setValue' })}
            <button type="submit" class="button button--primary">${MK.t('equipment.search.submit')}</button>
          </form>
          ${C.FilterTabs({
            label: MK.t('equipment.category.label'),
            value: state.category,
            action: 'setCategory',
            options: CATEGORIES.map((c) => ({ value: c, label: MK.t(`equipment.category.${c || 'all'}`) })),
          })}`;
        let content;
        if (status === 'loading') content = C.CardListSkeleton({ count: 6 });
        else if (status === 'error') content = html`<div class="card">${C.ErrorState({ body: MK.t('equipment.error') })}</div>`;
        else if (!data.rows.length) content = html`<div class="card">${filtered
          ? C.EmptyState({ title: MK.t('equipment.noMatch.title'), body: MK.t('equipment.noMatch.body') })
          : C.EmptyState({ title: MK.t('equipment.empty.title'), body: MK.t('equipment.empty.body') })}</div>`;
        else content = html`
          ${C.ItemCardList({ items: data.rows, label: MK.t('equipment.list.label'), requestHref })}
          ${C.Pagination({ page: state.cursors.length + 1, hasPrev: state.cursors.length > 0, nextCursor: data.next_cursor, prevAction: 'prevPage', nextAction: 'nextPage' })}`;
        return html`<div class="stack">
          <h1>${MK.t('equipment.title')}</h1>
          <p class="muted">${MK.can('loan:request') ? MK.t('equipment.intro.staff') : MK.t('equipment.intro.coordinator')}</p>
          ${toolbar}
          ${content}
        </div>`;
      },
    });
  </script>
</body>
</html>
